name: MeritQuant Backtester

on:
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 6am UTC — before US pre-market
  workflow_dispatch:        # Manual trigger any time

jobs:
  backtest:
    name: Run Backtest & Generate Report
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Restore pip cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-backtest-pip-v1
          restore-keys: ${{ runner.os }}-backtest-pip-

      - name: Install dependencies
        run: pip install --upgrade pip yfinance pandas numpy

      - name: Run backtest (2023-01-01 → today)
        run: python backtest.py --start 2023-01-01 --out reports/backtest.html

      - name: Commit report
        run: |
          git config --global user.email "bot@meritquant.ai"
          git config --global user.name "MeritQuant Bot"
          git add reports/backtest.html
          git diff --staged --quiet || \
            git commit -m "backtest: $(date -u '+%Y-%m-%d') [skip ci]"
          git push || (git pull --rebase origin main && git push)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
